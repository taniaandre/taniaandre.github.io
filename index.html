<meta name="description" content="Étudiante en Master 2 PSM, designer UX/UI et développeuse front-end, à la recherche d'un stage ou d'une alternance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#F3F6FF;--glass:rgba(255,255,255,.72);--ink:#1B1440;--mute:#5d5680;--violet:#A5BEFF;--pink:#FF9CC2;--sun:#A5BEFF;--mint:#B9F3D8;--cyan:#67d4ff;--edge:rgba(27,20,64,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font:400 1.02rem/1.6 'DM Sans',sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.05;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #3F5FC9;outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
section{padding:72px 0;position:relative}
.sh{font-size:clamp(2rem,5vw,3.3rem);font-weight:800;margin-bottom:12px;max-width:18ch}
.sub{color:var(--mute);max-width:52ch;margin-bottom:36px}
.glow{position:fixed;border-radius:50%;filter:blur(110px);opacity:.35;pointer-events:none;z-index:0}
.g1{width:380px;height:380px;background:#c7d6ff;top:40px;left:-120px}
.g2{width:440px;height:440px;background:#ffc2dc;top:38%;right:-160px}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 12% 8%,rgba(255,156,194,.35),transparent 70%),radial-gradient(50% 40% at 90% 30%,rgba(185,243,216,.55),transparent 70%),radial-gradient(55% 45% at 20% 85%,rgba(165,190,255,.5),transparent 70%),radial-gradient(60% 50% at 85% 95%,rgba(165,190,255,.22),transparent 70%)}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--edge);border-radius:28px}

/* nav */
nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;background:var(--glass);backdrop-filter:blur(16px);border:2px solid var(--ink);border-radius:99px;padding:6px;box-shadow:4px 4px 0 var(--violet);max-width:calc(100vw - 20px)}
nav a{font:500 .9rem 'DM Sans';padding:8px 14px;border-radius:99px;white-space:nowrap}
nav a:hover{background:rgba(27,20,64,.08)}
nav .cta{background:var(--sun);color:#1B1440;font-weight:700}
@media(max-width:760px){nav .hide{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:700 .95rem 'DM Sans';padding:14px 24px;border-radius:99px;border:2px solid var(--ink);background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--violet);cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--violet)}
.btn.p{background:var(--violet);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn.p:hover{box-shadow:2px 2px 0 var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:14px}

/* hero */
.hero{padding-top:120px}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--mint);color:#0d3b2a;font-weight:700;font-size:.9rem;padding:8px 16px;border-radius:99px;border:2px solid #0d3b2a}
.badge i{width:10px;height:10px;border-radius:50%;background:#12a05c;anim
